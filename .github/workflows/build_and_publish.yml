# check runners here https://github.com/actions/runner-images/tree/main
name: build_and_publish
on:
  release:
    types: [published]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # ---------------------------------------------------------------------------
  # Linux build
  # ---------------------------------------------------------------------------
  linux:
    name: Build Linux wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # ---------------------------------------------------------------------------
  # Windows + macOS: one runner per architecture, split by Python version
  # ---------------------------------------------------------------------------
  wheels:
    name: Build ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - windows-2025-vs2026  # x86_64
          - macos-15             # arm64
          - macos-26-intel       # x86_64
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-2025-vs2026
            target: x86_64
          - os: macos-15
            target: aarch64
          - os: macos-26-intel
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

  # ---------------------------------------------------------------------------
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [linux, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "wheels-*/*"
      - name: Show downloaded files
        run: find . -name "*.whl" -o -name "*.tar.gz" | sort
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ 'wheels-*/*' 'sdist/*'
